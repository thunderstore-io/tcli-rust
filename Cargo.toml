[package]
name = "tcli"
version = "0.3.0"
edition = "2021"

[dependencies]
once_cell = "1.21"
wildmatch = "2.4"
reqwest = { version = "0.11", features = ["json", "stream"] }

petgraph = { version = "0.6", features = ["serde-1"] }

# errors, ux, other user-facing communication
thiserror = "1.0"
miette = { version = "5.10", features = ["fancy"] }
colored = "2.2"
indicatif = { version = "0.17.11", features = ["improved_unicode", "tokio"] }

# async runtime and helpers
futures = "0.3"
futures-util = "0.3"
tokio = { version = "1.44", features = [
    "macros",
    "process",
    "rt-multi-thread",
] }
tokio-util = { version = "0.7", features = ["io"] }
async-compression = { version = "0.4", features = ["futures-io", "gzip"] }

# parsers, serializations, and other data processing
clap = { version = "4.5", features = ["derive", "color"] }
figment = { version = "0.10", features = ["env", "toml"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_with = "2.3"
toml = "0.7.8"
md-5 = "0.10"
base64 = "0.21"

# files, directories, and other fs operations
walkdir = "2.5"
zip = "2.6.1"
directories = "5.0"
steamlocate = "2.0.1"

sysinfo = "0.29"
chrono = { version = "0.4.40", features = ["serde"] }
log = "0.4.27"

[target.'cfg(windows)'.dependencies]
winreg = "0.50"

[dev-dependencies]
tempfile = "3.19"
